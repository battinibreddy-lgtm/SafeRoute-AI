stages:
  - lint
  - format
  - type_check
  - test
  - coverage

image: python:3.12

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

before_script:
  - python -V
  - pip install -U pip
  - pip install -r requirements.txt
  - pip install ruff mypy pytest pytest-cov

# ---------------- LINT ----------------
lint:
  stage: lint
  script:
    - ruff check .

# ---------------- FORMAT CHECK ----------------
format:
  stage: format
  script:
    - ruff format --check .

# ---------------- TYPE CHECK ----------------
type_check:
  stage: type_check
  script:
    - mypy .

# ---------------- TEST ----------------
test:
  stage: test
  script:
    - pytest -q

# ---------------- COVERAGE ----------------
coverage:
  stage: coverage
  script:
    - pytest --cov=. --cov-report=term --cov-report=xml
    - pytest --cov=. --cov-report=term --cov-fail-under=80
