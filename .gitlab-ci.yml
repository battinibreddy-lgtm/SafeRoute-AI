stages:
  - lint
  - format
  - type_check
  - test
  - coverage

.python-job:
  image: python:3.12
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements-dev.txt
  cache:
    key: python-3.12
    paths:
      - .cache/pip
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

.frontend-job:
  image: node:20
  before_script:
    - npm --prefix frontend ci
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm/
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"

python-lint:
  extends: .python-job
  stage: lint
  script:
    - python -m pip install pylint==4.0.5
    - ruff check .
    - pylint --rcfile=.pylintrc --fail-under=9.0 backend tests
    - flake8 --extend-ignore=E402 backend tests
    - vulture backend/app backend/ml/train.py tests --min-confidence 80
    - bandit -c bandit.yaml -r backend
    - git ls-files '*.py' | xargs pyupgrade --py312-plus

semgrep:
  image: semgrep/semgrep:1.165.0
  stage: lint
  script:
    - semgrep scan --config=.semgrep.yml --error backend

frontend-lint:
  extends: .frontend-job
  stage: lint
  script:
    - npm --prefix frontend run lint
    - npm --prefix frontend run dead-code

format:
  extends: .python-job
  stage: format
  script:
    - ruff format --check .

frontend-format:
  extends: .frontend-job
  stage: format
  script:
    - npm --prefix frontend run format:check

type_check:
  extends: .python-job
  stage: type_check
  script:
    - mypy .

frontend-type-check:
  extends: .frontend-job
  stage: type_check
  script:
    - npm --prefix frontend run typecheck

python-tests:
  extends: .python-job
  stage: test
  script:
    - pytest -q
    - pip-audit -r backend/requirements.txt
    - python scripts/check_licenses.py

frontend-tests:
  extends: .frontend-job
  stage: test
  script:
    - npm --prefix frontend test
    - npm --prefix frontend run audit

coverage:
  extends: .python-job
  stage: coverage
  script:
    - pytest --cov=backend --cov-report=term-missing --cov-report=xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
    expire_in: 1 week

frontend-build:
  extends: .frontend-job
  stage: coverage
  script:
    - npm --prefix frontend run build
