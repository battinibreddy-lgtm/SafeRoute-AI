stages:
  - lint
  - format
  - type_check
  - quality
  - security
  - test
  - coverage

image: python:3.12

before_script:
  - python -V
  - pip install --upgrade pip
  - pip install ruff mypy pytest pytest-cov pip-audit
  - pip install vulture bandit pylint flake8 semgrep pyupgrade

# -----------------------
# LINT (Ruff)
# -----------------------
lint:
  stage: lint
  script:
    - ruff check .

# -----------------------
# FORMAT CHECK
# -----------------------
format:
  stage: format
  script:
    - ruff format --check .

# -----------------------
# TYPE CHECK (MyPy)
# -----------------------
type_check:
  stage: type_check
  script:
    - mypy .

# -----------------------
# QUALITY TOOLS (with reports)
# -----------------------

vulture:
  stage: quality
  script:
    - vulture backend/

pylint:
  stage: quality
  script:
    - pylint backend --output-format=json > pylint.json
  artifacts:
    reports:
      codequality: pylint.json
    paths:
      - pylint.json

flake8:
  stage: quality
  script:
    - flake8 backend

pyupgrade:
  stage: quality
  script:
    - pyupgrade backend/**/*.py

# -----------------------
# SECURITY (SAST + Dependency audit)
# -----------------------

bandit:
  stage: security
  script:
    - bandit -r backend -f json -o bandit.json
  artifacts:
    reports:
      sast: bandit.json
    paths:
      - bandit.json

semgrep:
  stage: security
  script:
    - semgrep --config=auto --json --output=semgrep.json backend
  artifacts:
    reports:
      sast: semgrep.json
    paths:
      - semgrep.json

dependency_audit:
  stage: security
  script:
    - pip-audit

# -----------------------
# TESTS
# -----------------------
test:
  stage: test
  script:
    - pytest -q

# -----------------------
# COVERAGE (GitLab-compatible)
# -----------------------
coverage:
  stage: coverage
  script:
    - pytest --cov=. --cov-report=xml --cov-report=term --cov-fail-under=80
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
