stages:
  - quality
  - security
  - test

.python-job:
  image: python:3.12
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements-dev.txt
  cache:
    key: python-3.12
    paths:
      - .cache/pip
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

.frontend-job:
  image: node:20
  before_script:
    - npm --prefix frontend ci
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm/
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"

python-quality:
  extends: .python-job
  stage: quality
  script:
    - ruff check .
    - ruff format --check .
    - mypy .
    - vulture backend/app backend/ml/train.py tests --min-confidence 80

frontend-quality:
  extends: .frontend-job
  stage: quality
  script:
    - npm --prefix frontend run format:check
    - npm --prefix frontend run lint
    - npm --prefix frontend run typecheck
    - npm --prefix frontend run dead-code

python-security:
  extends: .python-job
  stage: security
  script:
    - bandit -c bandit.yaml -r backend
    - pip-audit -r backend/requirements.txt
    - python scripts/check_licenses.py

frontend-security:
  extends: .frontend-job
  stage: security
  script:
    - npm --prefix frontend run audit

python-tests:
  extends: .python-job
  stage: test
  script:
    - pytest -q
    - pytest --cov=backend --cov-report=term-missing

frontend-tests:
  extends: .frontend-job
  stage: test
  script:
    - npm --prefix frontend test
