stages:
  - lint
  - format
  - typecheck
  - quality
  - security
  - test
  - coverage

# -----------------------
# GLOBAL SETTINGS
# -----------------------
image: python:3.12

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

before_script:
  - python -V
  - pip install --upgrade pip
  - pip install -r requirements.txt || true
  - pip install ruff mypy pytest pytest-cov pip-audit bandit semgrep vulture pylint flake8 pyupgrade

# -----------------------
# LINT (FAST FAIL)
# -----------------------
lint:
  stage: lint
  script:
    - ruff check .
  allow_failure: false

# -----------------------
# FORMAT CHECK (NON BLOCKING)
# -----------------------
format:
  stage: format
  script:
    - ruff format --check .
  allow_failure: true

# -----------------------
# TYPE CHECK (STRICT)
# -----------------------
typecheck:
  stage: typecheck
  script:
    - mypy backend
  allow_failure: false

# -----------------------
# CODE QUALITY (MIXED)
# -----------------------
vulture:
  stage: quality
  script:
    - vulture backend/ --min-confidence 70
  allow_failure: true

pylint:
  stage: quality
  script:
    - pylint backend --exit-zero --output-format=text
  allow_failure: true

flake8:
  stage: quality
  script:
    - flake8 backend
  allow_failure: false

pyupgrade:
  stage: quality
  script:
    - pyupgrade $(find backend -name "*.py")
  allow_failure: true

# -----------------------
# SECURITY (STRICT)
# -----------------------
bandit:
  stage: security
  script:
    - bandit -r backend -ll
  allow_failure: false

dependency_audit:
  stage: security
  script:
    - pip-audit
  allow_failure: false

semgrep:
  stage: security
  script:
    - semgrep --config=auto backend
  allow_failure: false

# -----------------------
# TESTS
# -----------------------
test:
  stage: test
  script:
    - pytest -q
  artifacts:
    when: always
    reports:
      junit: report.xml

# -----------------------
# COVERAGE (STRICT GATE)
# -----------------------
coverage:
  stage: coverage
  script:
    - pytest --cov=backend --cov-report=term --cov-report=xml --cov-fail-under=80
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  allow_failure: false
