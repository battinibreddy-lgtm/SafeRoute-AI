stages:
  - lint
  - format
  - type_check
  - test
  - coverage

image: python:3.12

before_script:
  - pip install -U pip
  - pip install -r requirements.txt
  - pip install ruff mypy pytest pytest-cov

lint:
  stage: lint
  tags: []
  script:
    - ruff check .

format:
  stage: format
  tags: []
  script:
    - ruff format --check .

type_check:
  stage: type_check
  tags: []
  script:
    - mypy .

test:
  stage: test
  tags: []
  script:
    - pytest -q

coverage:
  stage: coverage
  tags: []
  script:
    - pytest --cov=. --cov-report=term --cov-fail-under=80
