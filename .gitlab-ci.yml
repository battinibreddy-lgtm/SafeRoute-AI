stages:
  - lint
  - format
  - type_check
  - test
  - coverage
  - security

image: python:3.12

before_script:
  - python -V
  - pip install --upgrade pip
  - pip install ruff mypy pytest pytest-cov pip-audit

# -----------------------
# LINT
# -----------------------
lint:
  stage: lint
  script:
    - ruff check .

# -----------------------
# FORMAT CHECK
# -----------------------
format:
  stage: format
  script:
    - ruff format --check .

# -----------------------
# TYPE CHECK
# -----------------------
type_check:
  stage: type_check
  script:
    - mypy .

# -----------------------
# TESTS
# -----------------------
test:
  stage: test
  script:
    - pytest -q

# -----------------------
# COVERAGE GATE
# -----------------------
coverage:
  stage: coverage
  script:
    - pytest --cov=. --cov-report=term --cov-fail-under=80

# -----------------------
# DEPENDENCY SECURITY AUDIT
# -----------------------
dependency_audit:
  stage: security
  script:
    - pip-audit
