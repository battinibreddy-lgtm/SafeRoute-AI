stages:
  - lint
  - format
  - type_check
  - test
  - coverage

image: python:3.12

before_script:
  - python -V
  - pip install --upgrade pip --timeout 120 --retries 5
  - pip install ruff mypy pytest pytest-cov --timeout 120 --retries 5
lint:
  stage: lint
  script:
    - ruff check .

format:
  stage: format
  script:
    - ruff format --check .

type_check:
  stage: type_check
  script:
    - mypy .

test:
  stage: test
  script:
    - pytest -q

coverage:
  stage: coverage
  script:
    - pytest --cov=. --cov-report=term --cov-fail-under=80
